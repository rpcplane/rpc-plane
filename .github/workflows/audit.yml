name: Audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    # Daily at 12:00 UTC — catches CVEs filed after the last push.
    - cron: "0 12 * * *"
  workflow_dispatch:

# audit-check opens an issue when a new advisory lands on a push/schedule run,
# and writes a check run on PRs. The default GITHUB_TOKEN is read-only here, so
# both are granted explicitly.
permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
